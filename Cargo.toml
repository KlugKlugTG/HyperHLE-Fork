[workspace]
members = ["src/cpu/dynarmic_wrapper"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1.0"
arrayvec = "0.7"
bitflags = "2.4"
bytemuck = { version = "1.14", features = ["derive"] }
cc = "1.0"
cmake = "0.1"
crc32fast = "1.3"
encoding_rs = "0.8"
enumflags2 = "0.7"
glam = "0.28"
libc = "0.2"
log = "0.4"
num-traits = "0.2"
objc2 = "0.5"
objc2-foundation = "0.2"
parking_lot = "0.12"
rand = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.11"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "2.9", features = ["tls", "gzip"] }

[package]
name = "touchHLE"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "touchHLE"
path = "src/lib.rs"

[[bin]]
name = "touchHLE"
path = "src/bin.rs"

[features]
default = ["static"]
static = ["touchHLE_dynarmic_wrapper/static"]
experimental-aarch64 = ["touchHLE_dynarmic_wrapper/experimental-aarch64"]

[dependencies]
anyhow.workspace = true
arrayvec.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
crc32fast.workspace = true
encoding_rs.workspace = true
enumflags2.workspace = true
glam.workspace = true
libc.workspace = true
log.workspace = true
num-traits.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
touchHLE_dynarmic_wrapper = { path = "src/cpu/dynarmic_wrapper", features = ["static"] }

[build-dependencies]
cargo-license = "0.5.1"
cc.workspace = true
cmake.workspace = true
gl_generator = "0.14"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
