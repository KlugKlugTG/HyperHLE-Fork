# TEMPORARY (arena session): surfaces compiler diagnostics as annotations.
name: Arena compile diagnostics
on:
  push:
    branches: [ "arena/f64cdc45-hyperhle-fork" ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        # SDL2 and openal-soft are built from source (the `static` feature uses
        # the `bundled` SDL2 build), so the development headers for the audio,
        # video and input backends they detect must be available.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Check
        run: |
          set +e
          cargo check --message-format=short 2> build.log
          status=$?
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (error|warning)' build.log | grep -v '^/home' | grep -v '\.cargo/' > diag.txt
          grep -E ': error' diag.txt > errors.txt
          grep -E ': warning' diag.txt > warnings.txt
          echo "status=$status"; cat diag.txt | head -200
          i=0
          while IFS= read -r line; do i=$((i+1)); [ $i -le 10 ] && echo "::error::E$i $line"; done < errors.txt
          i=0
          while IFS= read -r line; do i=$((i+1)); [ $i -gt 10 ] && [ $i -le 20 ] && echo "::warning::E$i $line"; done < errors.txt
          i=0
          tail -n +1 warnings.txt | while IFS= read -r line; do i=$((i+1)); [ $i -le 10 ] && echo "::notice::W$i $line"; done
          tail -5 build.log | while IFS= read -r line; do echo "::notice::TAIL $line"; done
          exit $status
